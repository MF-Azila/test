<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Breakdown Verifier</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
    font-size: 13px;
  }

  /* ── Top bar ── */
  .topbar {
    background: #fff;
    border-bottom: 1px solid #e2e8f0;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .topbar-back {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #64748b;
    text-decoration: none;
    font-size: 12px;
    padding: 4px 8px;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    cursor: pointer;
  }
  .topbar-back:hover { background: #f8fafc; }
  .run-id { font-weight: 600; font-size: 13px; }
  .run-ago { color: #94a3b8; font-size: 11px; }
  .topbar-links { margin-left: auto; display: flex; gap: 12px; }
  .topbar-links a { color: #3b82f6; text-decoration: none; font-size: 12px; }

  /* ── Meta row ── */
  .meta-bar {
    background: #fff;
    border-bottom: 1px solid #e2e8f0;
    padding: 6px 20px;
    font-size: 11px;
    color: #64748b;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
  }
  .meta-bar strong { color: #1e293b; }

  /* ── Layout ── */
  .layout {
    display: flex;
    height: calc(100vh - 85px);
    overflow: hidden;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 220px;
    min-width: 220px;
    background: #fff;
    border-right: 1px solid #e2e8f0;
    overflow-y: auto;
    padding: 12px 0;
  }
  .sidebar-section-title {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #94a3b8;
    padding: 8px 16px 4px;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    cursor: pointer;
    border-radius: 0;
    color: #475569;
    font-size: 12px;
    text-decoration: none;
  }
  .sidebar-item:hover { background: #f8fafc; }
  .sidebar-item.active { background: #eff6ff; color: #2563eb; font-weight: 600; }
  .sidebar-item .icon { width: 16px; height: 16px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
  .sidebar-item .icon.pass { background: #dcfce7; color: #16a34a; }
  .sidebar-item .icon.fail { background: #fee2e2; color: #dc2626; }
  .sidebar-item .icon.s { background: #dbeafe; color: #2563eb; }
  .sidebar-item .badge { margin-left: auto; font-size: 10px; color: #94a3b8; }

  /* ── Main content ── */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
  }

  /* ── Run header card ── */
  .run-header {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 20px;
  }
  .run-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .run-title { font-size: 16px; font-weight: 700; }
  .run-sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }
  .stats-row {
    display: flex;
    gap: 0;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    overflow: hidden;
  }
  .stat-cell {
    flex: 1;
    padding: 10px 14px;
    border-right: 1px solid #e2e8f0;
    text-align: center;
  }
  .stat-cell:last-child { border-right: none; }
  .stat-num { font-size: 22px; font-weight: 700; }
  .stat-num.pass { color: #16a34a; }
  .stat-num.fail { color: #dc2626; }
  .stat-num.missing { color: #f59e0b; }
  .stat-num.neutral { color: #64748b; }
  .stat-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
  .failures-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #64748b; cursor: pointer; user-select: none; }
  .failures-toggle input { cursor: pointer; }

  /* ── Section card ── */
  .section-card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .section-header {
    padding: 14px 20px;
    border-bottom: 1px solid #e2e8f0;
  }
  .section-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .section-desc { font-size: 11px; color: #64748b; }
  .section-desc a { color: #3b82f6; }

  /* ── Table ── */
  .charge-table { width: 100%; border-collapse: collapse; }
  .charge-table th {
    padding: 8px 12px;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #64748b;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
  }
  .charge-table td {
    padding: 10px 12px;
    border-bottom: 1px solid #f1f5f9;
    vertical-align: top;
  }
  .charge-table tr:last-child td { border-bottom: none; }
  .charge-table tr:hover td { background: #fafbfc; }

  .module-cell { font-weight: 600; }
  .keterangan-cell { color: #475569; }

  .charge-val { font-weight: 600; font-size: 13px; }
  .charge-expected { font-size: 11px; color: #94a3b8; margin-top: 2px; }
  .charge-dash { color: #cbd5e1; font-size: 13px; }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .badge.pass { background: #dcfce7; color: #16a34a; }
  .badge.fail { background: #fee2e2; color: #dc2626; }
  .badge.unmapped { background: #fef9c3; color: #a16207; }
  .badge.missing { background: #fce7f3; color: #9d174d; }

  /* ── Fails detail ── */
  .fails-detail {
    margin-top: 6px;
    font-size: 11px;
    color: #dc2626;
  }

  /* ── Full rule reference ── */
  .rule-ref {
    padding: 12px 20px;
    background: #f8fafc;
    border-top: 1px solid #e2e8f0;
    font-size: 11px;
    color: #64748b;
  }

  /* ── How charges are checked (collapsible) ── */
  details summary {
    cursor: pointer;
    color: #3b82f6;
    font-size: 12px;
    padding: 10px 20px;
    border-top: 1px solid #e2e8f0;
    list-style: none;
  }
  details summary::before { content: "▶ "; font-size: 10px; }
  details[open] summary::before { content: "▼ "; }
  .rule-table-wrap { padding: 0 20px 16px; overflow-x: auto; }
  .rule-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .rule-table th, .rule-table td { padding: 6px 10px; border: 1px solid #e2e8f0; text-align: right; }
  .rule-table th { background: #f8fafc; font-weight: 700; text-align: center; }
  .rule-table td:first-child { text-align: left; font-weight: 600; }
  .null-cell { color: #cbd5e1; }

  /* ── Loading / error states ── */
  .state-msg { padding: 40px; text-align: center; color: #94a3b8; font-size: 14px; }
  .state-msg .icon { font-size: 32px; margin-bottom: 12px; }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-back">&#8592; Back to all runs</span>
  <div>
    <div class="run-id" id="run-id">Loading…</div>
  </div>
  <div class="topbar-links">
    <a href="summary.json" target="_blank">summary.json</a>
  </div>
</div>

<div class="meta-bar" id="meta-bar">Loading metadata…</div>

<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="state-msg"><div class="icon">⏳</div>Loading…</div>
  </nav>

  <main class="main" id="main">
    <div class="state-msg"><div class="icon">⏳</div>Loading report…</div>
  </main>
</div>

<script>
const fmt = (v) => v == null ? null : Number(v).toFixed(2);

function chargeCell(chargeObj) {
  if (!chargeObj || chargeObj.expected == null) {
    return `<span class="charge-dash">–</span>`;
  }
  const act = chargeObj.actual != null ? chargeObj.actual : chargeObj.expected;
  const exp = chargeObj.expected;
  const mismatch = Math.abs(act - exp) > 0.02;
  return `
    <div class="charge-val${mismatch ? ' fail-color' : ''}">${fmt(act)}</div>
    <div class="charge-expected">expected ${fmt(exp)}</div>
  `;
}

function renderTable(modules, failsOnly) {
  const filtered = failsOnly ? modules.filter(m => m.status !== "PASS") : modules;
  if (!filtered.length) {
    return `<div class="state-msg"><div class="icon">✅</div>No failures found.</div>`;
  }

  let html = `
    <table class="charge-table">
      <thead>
        <tr>
          <th>Module</th>
          <th>Keterangan</th>
          <th>JPI</th>
          <th>FIS</th>
          <th>EAUTO</th>
          <th>Service Tax</th>
          <th>Overall</th>
        </tr>
      </thead>
      <tbody>`;

  for (const mod of filtered) {
    const rows = failsOnly ? mod.rows.filter(r => r.status !== "PASS") : mod.rows;
    if (!rows.length) continue;
    rows.forEach((row, idx) => {
      const c = row.charges || {};
      const failDetail = row.fails && row.fails.length
        ? `<div class="fails-detail">${row.fails.map(f => `${f.vehicle}: got ${fmt(f.amount)}, expected ${fmt(f.expected_total)}`).join(', ')}</div>`
        : '';
      html += `
        <tr>
          <td class="module-cell">${idx === 0 ? mod.name : ''}</td>
          <td class="keterangan-cell">${row.keterangan}</td>
          <td>${chargeCell(c.JPI)}</td>
          <td>${chargeCell(c.FIS)}</td>
          <td>${chargeCell(c.EAUTO)}</td>
          <td>${chargeCell(c.SERVICE_TAX)}</td>
          <td><span class="badge ${row.status.toLowerCase()}">${row.status}</span>${failDetail}</td>
        </tr>`;
    });
  }

  html += `</tbody></table>`;
  return html;
}

function renderRuleTable(config) {
  if (!config || !config.charge_rules) return '';
  const rules = config.charge_rules;
  let rows = '';
  for (const [type, rule] of Object.entries(rules)) {
    if (rule.tiers) {
      rule.tiers.forEach((tier, i) => {
        const label = i === 0 ? type : '';
        rows += `<tr>
          <td>${label} <small style="color:#94a3b8">${tier.total_min}–${tier.total_max >= 9999 ? '∞' : tier.total_max}</small></td>
          <td>${tier.JPI != null ? tier.JPI : '<span class="null-cell">–</span>'}</td>
          <td>${tier.FIS != null ? tier.FIS : '<span class="null-cell">–</span>'}</td>
          <td>${tier.EAUTO != null ? tier.EAUTO : '<span class="null-cell">–</span>'}</td>
          <td>${tier.SERVICE_TAX != null ? tier.SERVICE_TAX : '<span class="null-cell">–</span>'}</td>
        </tr>`;
      });
    } else {
      rows += `<tr>
        <td>${type}</td>
        <td>${rule.JPI != null ? rule.JPI : '<span class="null-cell">–</span>'}</td>
        <td>${rule.FIS != null ? rule.FIS : '<span class="null-cell">–</span>'}</td>
        <td>${typeof rule.EAUTO === 'string' ? rule.EAUTO : (rule.EAUTO != null ? rule.EAUTO : '<span class="null-cell">–</span>')}</td>
        <td>${rule.SERVICE_TAX != null ? rule.SERVICE_TAX : '<span class="null-cell">–</span>'}</td>
      </tr>`;
    }
  }
  return `
    <details>
      <summary>How charges are checked</summary>
      <div class="rule-table-wrap">
        <table class="rule-table">
          <thead><tr><th>Transaction Type</th><th>JPI</th><th>FIS</th><th>EAUTO</th><th>SERVICE TAX</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </details>`;
}

async function loadConfig() {
  try {
    const r = await fetch('config.json');
    return r.ok ? r.json() : null;
  } catch { return null; }
}

async function init() {
  let data, config;
  try {
    [data, config] = await Promise.all([
      fetch('summary.json').then(r => r.json()),
      loadConfig()
    ]);
  } catch (e) {
    document.getElementById('main').innerHTML = `
      <div class="state-msg">
        <div class="icon">⚠️</div>
        <strong>Could not load summary.json</strong><br>
        Run <code>python3 verifier.py &lt;your-report.xlsx&gt;</code> to generate it,<br>
        then serve this folder with <code>python3 -m http.server 3470</code>.
      </div>`;
    return;
  }

  const s = data.stats;

  // Top bar
  document.getElementById('run-id').textContent = data.run_id;

  // Meta bar
  document.getElementById('meta-bar').innerHTML = `
    <span><strong>STARTED</strong> ${data.started}</span>
    <span><strong>FILE</strong> ${data.source_file}</span>
    <span><strong>MODULES</strong> ${s.modules}</span>
    <span><strong>RECORDS</strong> ${s.records}</span>
  `;

  // Sidebar
  const sidebarEl = document.getElementById('sidebar');
  let sidebarHtml = `
    <div class="sidebar-section-title">Overview</div>
    <a class="sidebar-item active" href="#charges">
      <span class="icon s">$</span> Charges check
    </a>
    <div class="sidebar-section-title" style="margin-top:12px">Modules</div>`;

  for (const mod of data.modules) {
    const cls = mod.status === 'PASS' ? 'pass' : 'fail';
    const tick = mod.status === 'PASS' ? '✓' : '✗';
    sidebarHtml += `
      <a class="sidebar-item" href="#mod-${mod.name.replace(/\s/g,'-')}">
        <span class="icon ${cls}">${tick}</span>
        ${mod.name}
        <span class="badge-text" style="margin-left:auto;font-size:10px;color:#94a3b8">${mod.record_count} rec</span>
      </a>`;
  }
  sidebarEl.innerHTML = sidebarHtml;

  // Main content
  let failsOnly = false;

  function renderMain() {
    const ruleHtml = renderRuleTable(config);
    document.getElementById('main').innerHTML = `
      <div class="run-header" id="charges">
        <div class="run-title-row">
          <div>
            <div class="run-title">Payment Breakdown Verifier</div>
            <div class="run-sub">Run ${data.run_id}</div>
          </div>
          <label class="failures-toggle">
            <input type="checkbox" id="fail-toggle" ${failsOnly ? 'checked' : ''}> Show failures only
          </label>
        </div>
        <div class="stats-row">
          <div class="stat-cell">
            <div class="stat-num pass">${s.pass}</div>
            <div class="stat-label">Pass</div>
          </div>
          <div class="stat-cell">
            <div class="stat-num fail">${s.fail}</div>
            <div class="stat-label">Fail</div>
          </div>
          <div class="stat-cell">
            <div class="stat-num missing">${s.missing}</div>
            <div class="stat-label">Missing</div>
          </div>
          <div class="stat-cell">
            <div class="stat-num neutral">${s.unmapped}</div>
            <div class="stat-label">Unmapped</div>
          </div>
          <div class="stat-cell">
            <div class="stat-num neutral">${s.records}</div>
            <div class="stat-label">Records</div>
          </div>
          <div class="stat-cell">
            <div class="stat-num neutral">${s.modules}</div>
            <div class="stat-label">Modules</div>
          </div>
        </div>
      </div>

      <div class="section-card">
        <div class="section-header">
          <div class="section-title">Charges Check</div>
          <div class="section-desc">
            Per-record amount columns from the XLSX export, compared against the rules in <strong>config.json</strong>.
            Expand <strong>"How charges are checked"</strong> for the full rule reference.
          </div>
        </div>
        <div id="charges-table">${renderTable(data.modules, failsOnly)}</div>
        ${ruleHtml}
      </div>`;

    document.getElementById('fail-toggle').addEventListener('change', e => {
      failsOnly = e.target.checked;
      document.getElementById('charges-table').innerHTML = renderTable(data.modules, failsOnly);
    });
  }

  renderMain();
}

init();
</script>
</body>
</html>
