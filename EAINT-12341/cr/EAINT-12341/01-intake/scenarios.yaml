cases:
- id: 12341_TS01
  section: A — RHB Account Registration Guideline email to the UCD (Email Template 1, combined)
  chain: 12341_CH1
  req: REQ-001, REQ-002
  title: Guideline email is sent to the UCD on Application approval, To = UCD email, CC = apply@eauto.my
  type: Functional / Positive
  prio: High
  pre: 'Precondition: chain 12341_CH1 has been executed by the automation up to Application Approved (see the ''Test Data
    & Chains'' sheet). The run log''s READY FOR MANUAL EMAIL CHECK block gives the UCD email, Application No, Pre-Application
    No, company name, BRNs and the approval timestamp used below.'
  steps: '1. Open Mailtrap (staging inbox).

    2. Search for the UCD email address from the run log.

    3. Locate the email whose subject starts with ''RHB Online / Branch Account Opening''.

    4. Open the email headers (To, CC).

    5. Note the received time and compare it with the ''application approved'' timestamp in the run log.'
  expected: '• Exactly one RHB Account Registration Guideline email exists for this Application.

    • To: the UCD email address recorded in the approved Application.

    • CC: apply@eauto.my.

    • Received after the Application approval timestamp (not before).'
  remarks: 'Which field is the ''UCD email captured in the Application'' (Admin In Charge email on the Pre-Application vs
    Director/Business Owner in Charge email on Application step 3) is Q-04. The chain uses DIFFERENT addresses for the two
    so the To field shows which one the system took — record it in Actual Result.

    Sender is ''Pending confirmation from Operations'' — do not assert From (Q-12).'
  red: false
