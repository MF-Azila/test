# Nothing from the workbook is excluded — all 21 rows are above. These are
# coverage the documents imply but no case exercises. NOT added: a human decides.
excluded:
  - id: "(not in workbook) Pre-Application approval fires no new email"
    reason: "B5 states Pre-Application approval is not a trigger. No case asserts it, although every chain passes through that step, so the check costs nothing extra."
  - id: "(not in workbook) ROB PREVIOUS_OWNER excluded from the count"
    reason: "B8 counts CURRENT_OWNER only. E2E1–4 seed current owners only, so a count that includes previous owners would pass all of them. seed-ssm supports it (--shareholders on ROB seeds PREVIOUS_OWNER)."
  - id: "(dropped from the v1.0 sheet, old E2E11) LLP resigned partner"
    reason: "Test_Case_1.xlsx (v1.0) had '5 partners, 1 resigned' BLOCKED on BA question 6 (involveEffectiveToDt). The current sheet drops it and B8 does not say whether ended involvements count."
  - id: "(dropped from the v1.0 sheet, old E2E10) one person as both PT and CO"
    reason: "v1.0 noted the sample LLP response has one person as both COMPLIANCE OFFICER and PARTNER with the same involveId. B8's 'PT only' rule means the CO row is excluded, which likely answers it, but no case seeds that shape."
  - id: "(dropped from the v1.0 sheet, old R4) UCD email missing or malformed"
    reason: "v1.0 had it BLOCKED on BA question 9 (affects REQ-002 and REQ-006, since the UCD is also CC on Template 3). Dropped in the current sheet with no answer recorded."
  - id: "(dropped from the v1.0 sheet, old R3 remark) Application Link 90-day expiry"
    reason: "v1.0 R3 noted [Application Link] is generated at approval and starts the 90-day expiry clock (EAINT-11829). Current R3 only checks that it resolves."
  - id: "(dropped from the v1.0 sheet, old R5 remark) checklist wording"
    reason: "v1.0 asked the BA whether the hardcopy checklist wording (RHB Offer Letter / DDA / BoD Reso) is still accurate now that RHB issues them. Current R4 drops the question."
