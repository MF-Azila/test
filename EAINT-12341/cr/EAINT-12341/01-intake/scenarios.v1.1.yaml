# EAINT-12341 — normalised cases. Shape: cr/_schema/scenarios.example.yaml
#
# Generated from the workbook cells, verbatim. Do not hand-edit the case text —
# fix the mapping and re-read instead. `situation` / `expected_template` /
# `remarks` extend the example schema because this sheet splits the scenario
# across four sub-columns and keeps REQ refs + confirmations in Remarks.

meta:
  ticket: EAINT-12341
  title: "[eAuto-BackEnd & UCD] Replace Approved Application Email with New Emails to UCD and RHB Support"
  source_workbook: "EAINT-12341_Test_Case.xlsx"      # md5 25784f53716170f948f3db90a4e19371
  source_sheet: "EAINT-12341"
  source_srd: "SRD_EAINT-12341_v1.1_20260917 (1).pdf"  # md5 6de4184f9ba9f8a446d8a9adc688ec5e
  # Header is TWO rows (13-14). Row 13 "Test Scenarios" is merged B13:E13 and
  # has four sub-headers on row 14. A13, F13, G13, H13 are merged down to row 14.
  column_mapping:
    case_id: "A — 'TS No.' (A13:A14 merged)"
    situation.business_type: "B — 'Test Scenarios' > 'Business Type'"
    situation.owners: "C — 'Test Scenarios' > 'No. of Directors / Business Owners'"
    situation.nationality: "D — 'Test Scenarios' > 'Nationality of Directors / Business Owners'"
    expected_template: "E — 'Test Scenarios' > 'Expected Template'  <- sits under the SCENARIO header but is part of the EXPECTED result"
    steps: "F — 'Steps' (F13:F14 merged)"
    expected: "G — 'Expected Result' (G13:G14 merged)"
    remarks: "H — 'Remarks' (REQ refs, rationale, confirmations)"
    priority: "(not in this sheet — left null, not defaulted)"
    ts_fill: "fill colour of column A — legend row 11: yellow = data to prepare, red = expected pending"
    section: "grey full-width rows (A15, A20, A25, A29, A31, A37, merged A:H) are group headings, not cases"
  header_block: "rows 1-11 (Ticket, Link, SRD, Test Objective, Trigger, Affected Pages, Determination Rule, Count Source, Verification, Note, Legend) — read as ticket-level requirements, not cases"
  legend_checks: "Legend says yellow TEXT in Expected Result = unconfirmed. The dumper does not record font colour, so the workbook was scanned directly (incl. rich-text runs): no yellow text anywhere. Only coloured text: B2 (hyperlink) and A30 (dark red, matching its red fill)."
  rows_read: "16-41; 21 cases, 6 section headings, 0 unparsed rows. No hidden rows/columns, no comments, one sheet."
  read_on: 2026-09-23
  read_by: agent
  confirmed_by: ""
  confirmed_on: ""

# Ticket-level rules from the header block, quoted so the plan can cite them.
rules:
  trigger: "Application approval only. Pre-Application approval is not a trigger and is unchanged by this CR.   (B5)"
  determination: "Email Template 1 requires 4 or fewer directors / business owners AND no foreign director / business owner. Any other combination sends Email Template 2. Nationality is derived from the IC value: 12 digits is read as Malaysian, any other format is read as foreign. A foreign director is counted but does not display in SSM Details.   (B7)"
  count_source: "ROB — CURRENT_OWNER.   ROC — DIRECTORS > DIRECTOR, DESIGNATION = DIRECTOR only; SECRETARY and SHAREHOLDERS are excluded.   LLP — INVOLVEMENTS > involvement, involveType = PT only; CO is excluded.   (B8)"
  verification: "All emails are verified in Mailtrap. No live email reaches BIS.Support@rhbgroup.com during testing.   (B9)"
  naming: "SRD's 'BackEnd' = BackOffice (BO).   (B10)"
  srd_notes:
    - "SRD v1.1 p21: the Template 3 sentence 'The above company is not eligible for RHB's online account-opening process…' is STRUCK THROUGH (withdrawn). pdftotext drops strikethrough and shows it as live text — read the rendered page, not the extract."
    - "SRD v1.1 p6: 'Both email templates are pending Operations feedback' is also struck through — templates are confirmed."
    - "SRD v1.1 p19: REQ-007 'Pending confirmation from Operations on the details to be pre-populated, the reference number format, and the authorised signatory' is highlighted cyan and NOT struck — still pending."
    - "Sender is 'Pending confirmation from Operations' for all three templates — no case may assert From."
    - "REQ-005 cites §2.2.4.2 for both Template 1 and 2 — Template 1 is §2.2.4.1. Typo; for SRD v1.2."
    - "REQ-008 attaches the Appointment Letter to the RHB Support email only; Templates 1 and 2 themselves say 'Please find the Appointment Letter attached', and the workbook records Lim Yi Link confirming all 3 emails carry it. For SRD v1.2 (the workbook already says so)."
    - "RHB online registration link given in SRD §2.2.1 item 5: https://smecaonline.rhbgroup.com/sme/online?tag=campaign"

affected_pages:
  - portal: bo
    screen: "Application — Application Approval"
    change: "approving the Application triggers the 2 new emails (replaces the old approved-application email)"
  - portal: email
    screen: "RHB Account Registration Guideline (Email Template 1 / 2) → UCD"
    change: "new"
  - portal: email
    screen: "Appointment Letter (Email Template 3) → BIS.Support@rhbgroup.com, CC UCD + apply@eauto.my"
    change: "new"
  - portal: document
    screen: "Appointment Letter (generated PDF)"
    change: "new — attached to all 3 emails (per Lim Yi Link; see srd_notes)"
  - portal: ucd
    screen: "Pre-Application form"
    change: "none — exercised by every chain"
  - portal: bo
    screen: "Pre-Application approval"
    change: "none — exercised by every chain; must NOT trigger the new emails (rules.trigger)"
  - portal: ucd
    screen: "Application form"
    change: "none — exercised by every chain"
  - portal: bo
    screen: "Application > Registration Document (Request Hardcopy Resubmission)"
    change: "none — regression only (R4, EAINT-11763)"

# Reusable, not a spec. No existing spec asserts any case below.
reusable:
  - "automation/src/pages/obs/pre-application.page.ts — Pre-Application form, all 5 business types, payment"
  - "automation/src/pages/obs/fiuu.page.ts — FPX sandbox payment"
  - "automation/src/pages/obs/backoffice.page.ts — approvePreApplication, submitForApproval (boAdmin), approveApplication (bo)"
  - "automation/src/pages/obs/application.page.ts — Application form fill, uploads, submit"
  - "automation/scripts/seed-ssm.ts + src/data/ssm.ts — seeds ROB/ROC/LLP incl. --foreign, --secretaries, --shareholders; countedOwners() matches rules.count_source"
  - "automation/src/fixtures/mailtrap.ts — CC + attachment + polling support; UNPROVEN (MAILTRAP_TOKEN / MAILTRAP_ACCOUNT_ID empty)"
  - "automation/src/data/email-contracts.ts — ONBOARDING_CONTRACTS declared empty, waiting for exactly these templates"
  - "automation/tests/_explore/onboarding-e2e.spec.ts — the chain as an explore script (not a test)"

cases:
  - id: "12341_E2E1"
    section: "None"
    source: "EAINT-12341!A16:H16"
    ts_fill: "00FFFF00"   # yellow — test data to be prepared; consumes its own chain
    situation:
      business_type: "Sole Proprietorship / Partnership"
      owners: "4"
      nationality: "All Malaysian"
    expected_template: "Template 1 — Online"
    steps: |
      1. Submit a new Pre-Application via the UCD Pre-Application form for a company with 4 business owners, all Malaysian. Enter the test email address as the Admin In Charge.
      2. Complete the Pre-Application payment and confirm the Pre-Application record is created.
      3. In BackOffice, approve the Pre-Application.
      4. Open the Application form in the UCD portal and confirm the director / business owner details are prepopulated as expected.
      5. Complete the required uploads and submit the Application.
      6. In BackOffice > Application, open the submitted Application and approve it.
      7. In Mailtrap, check the email sent to the UCD email address captured in the Application.
      8. In Mailtrap, check the email sent to RHB Support.
    expected: |
      Ensure:
      • The RHB Account Registration Guideline email is received by the UCD email address captured in the Application.
      • apply@eauto.my appears in the CC field.
      • The subject line reads RHB Online Account Opening - [Application No] - [Company Name], with the actual values rendered.
      • The email body matches Email Template 1: the UCD proceeds with the RHB online account opening, the RHB online registration link is present, and the four (4) authorised or main users note appears.
      • The Appointment Letter is attached.
    remarks: |
      Boundary — exactly 4 with no foreign owner must still qualify for the online route. Catches < 4 coded instead of <= 4. REQ-001, REQ-002, REQ-003 (Example 1), REQ-004.
      Count source: CURRENT_OWNER.
      Confirmed by Lim Yi Link: the Appointment Letter is attached to all 3 emails, so Email Templates 1 and 2 carry it as well as Email Template 3. Note REQ-008 still reads as attaching it only to the RHB Support email — raise for SRD v1.2.
    priority: null        # not in the workbook
